<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요술봉 - 리플 효과</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            height: 100vh;
            /* 요술봉 커서 설정 */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' style='font-size:30px'><text y='30'>🪄</text></svg>") 0 30, auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .box {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }
        /* 별 모양 */
        .star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
   
        .moon {
            border-radius: 50%;
            background-color: transparent !important;
        }
        .instruction {
            color: rgba(255, 255, 255, 0.1);
            font-family: 'Arial', sans-serif;
            font-size: 2vw;
            letter-spacing: 5px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }

        /* 리플(물결) 효과 스타일 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: ripple-animation 1.5s cubic-bezier(0.1, 0.2, 0.3, 1) forwards;
            z-index: 5;
        }

        @keyframes ripple-animation {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0.8;
                border-width: 4px;
            }
            100% {
                transform: translate(-50%, -50%) scale(4);
                opacity: 0;
                border-width: 1px;
            }
        }
    </style>
</head>
<body>
    <div class="instruction">요술봉으로 얍! (클릭해보세요)</div>

    <script>
        const particles = [];

        // 마우스 이동 시 별 가루 효과
        document.addEventListener('mousemove', function(e) {
            for(let i = 0; i < 2; i++) {
                createParticle(e.clientX + 15, e.clientY - 15);
            }
        });

        // 클릭 시 물결(리플) 효과
        document.addEventListener('mousedown', function(e) {
            createRipple(e.clientX, e.clientY);
            // 클릭 시에는 더 많은 별 가루 생성
            for(let i = 0; i < 15; i++) {
                createParticle(e.clientX, e.clientY, true);
            }
        });

        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            
            // 랜덤한 크기의 물결
            const size = 100 + Math.random() * 50;
            ripple.style.width = `${size}px`;
            ripple.style.height = `${size}px`;
            
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            
     
            const hue = Math.random() * 360;
            ripple.style.borderColor = `hsla(${hue}, 100%, 80%, 0.5)`;
            
            document.body.appendChild(ripple);
            
            // 애니메이션 종료 후 제거
            ripple.addEventListener('animationend', () => {
                ripple.remove();
            });
        }

        function createParticle(x, y, isClick = false) {
            const el = document.createElement('div');
            const randomType = Math.random();
            
            let type = 'shape'; 
            if (randomType > 0.85) type = 'moon';
            else if (randomType > 0.6) type = 'star';
            
            el.className = `box ${type}`;
            
            const size = isClick ? Math.random() * 30 + 10 : Math.pow(Math.random(), 1.5) * 40 + 5;
            el.style.width = `${size}px`;
            el.style.height = `${size}px`;
            
            const hue = type === 'moon' ? 50 + Math.random() * 20 : Math.random() * 360;
            const lightness = 70 + Math.random() * 20;
            const color = `hsl(${hue}, 100%, ${lightness}%)`;
            
            if (type === 'moon') {
                el.style.boxShadow = `${size/3}px ${size/3}px 0 0 ${color}`;
            } else if (type === 'star') {
                el.style.backgroundColor = color;
                el.style.boxShadow = `0 0 ${size}px ${color}`;
            } else {
                el.style.borderRadius = `${Math.random() * 50}%`;
                el.style.backgroundColor = color;
                el.style.boxShadow = `0 0 ${size/2}px ${color}`;
                el.style.border = '1px solid rgba(255,255,255,0.3)';
            }
            
            document.body.appendChild(el);

            const velocityMultiplier = isClick ? 12 : 6;
            particles.push({
                element: el,
                x: x - size/2,
                y: y - size/2,
                vx: (Math.random() - 0.5) * velocityMultiplier,
                vy: (Math.random() - 0.5) * velocityMultiplier,
                rotation: Math.random() * 360,
                rv: (Math.random() - 0.5) * 15,
                opacity: 1,
                scale: 1
            });
        }

        function animate() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.opacity -= 0.012;
                p.scale -= 0.008;
                p.rotation += p.rv;
                p.x += p.vx;
                p.y += p.vy;

                p.element.style.left = `${p.x}px`;
                p.element.style.top = `${p.y}px`;
                p.element.style.transform = `rotate(${p.rotation}deg) scale(${p.scale})`;
                p.element.style.opacity = p.opacity;

                if (p.opacity <= 0 || p.scale <= 0) {
                    p.element.remove();
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
