<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요술봉</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            height: 100vh;
            /* 요술봉 커서 설정 (이모지를 활용한 커서) */
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' style='font-size:30px'><text y='30'>🪄</text></svg>") 0 30, auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }
        /* 별 모양 */
        .star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
        /* 달 모양 */
        .moon {
            border-radius: 50%;
            background-color: transparent !important;
        }
        .instruction {
            color: rgba(255, 255, 255, 0.1);
            font-family: 'Arial', sans-serif;
            font-size: 2vw;
            letter-spacing: 5px;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="instruction">요술봉으로 얍!</div>

    <script>
        const particles = [];

        document.addEventListener('mousemove', function(e) {
            // 요술봉 끝부분(오른쪽 위)에서 별이 나오는 것처럼 보이게 위치 살짝 조정
            for(let i = 0; i < 3; i++) {
                createParticle(e.clientX + 15, e.clientY - 15);
            }
        });

        function createParticle(x, y) {
            const el = document.createElement('div');
            const randomType = Math.random();
            
            let type = 'shape'; 
            if (randomType > 0.85) type = 'moon';
            else if (randomType > 0.6) type = 'star';
            
            el.className = `box ${type}`;
            
            const size = Math.pow(Math.random(), 1.5) * 40 + 5;
            el.style.width = `${size}px`;
            el.style.height = `${size}px`;
            
            const hue = type === 'moon' ? 50 + Math.random() * 20 : Math.random() * 360;
            const lightness = 70 + Math.random() * 20;
            const color = `hsl(${hue}, 100%, ${lightness}%)`;
            
            if (type === 'moon') {
                el.style.boxShadow = `${size/3}px ${size/3}px 0 0 ${color}`;
            } else if (type === 'star') {
                el.style.backgroundColor = color;
                el.style.boxShadow = `0 0 ${size}px ${color}`;
            } else {
                el.style.borderRadius = `${Math.random() * 50}%`;
                el.style.backgroundColor = color;
                el.style.boxShadow = `0 0 ${size/2}px ${color}`;
                el.style.border = '1px solid rgba(255,255,255,0.3)';
            }
            
            document.body.appendChild(el);

            particles.push({
                element: el,
                x: x - size/2,
                y: y - size/2,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                rotation: Math.random() * 360,
                rv: (Math.random() - 0.5) * 15,
                opacity: 1,
                scale: 1
            });
        }

        function animate() {
            particles.forEach((p, index) => {
                p.opacity -= 0.012;
                p.scale -= 0.008;
                p.rotation += p.rv;
                p.x += p.vx;
                p.y += p.vy;

                p.element.style.left = `${p.x}px`;
                p.element.style.top = `${p.y}px`;
                p.element.style.transform = `rotate(${p.rotation}deg) scale(${p.scale})`;
                p.element.style.opacity = p.opacity;

                if (p.opacity <= 0 || p.scale <= 0) {
                    p.element.remove();
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
