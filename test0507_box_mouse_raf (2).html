<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Star Trail - RAF</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            height: 100vh;
            cursor: crosshair;
        }
        .star {
            position: absolute;
            width: 30px;
            height: 30px;
            pointer-events: none;
            /* 별 모양 CSS (clip-path 사용) */
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            filter: drop-shadow(0 0 10px white);
        }
    </style>
</head>
<body>
    <script>
        document.addEventListener('mousemove', function(event) {
            createStar(event.clientX, event.clientY);
        });

        function createStar(x, y) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // 네온 컬러 랜덤 생성
            const hue = Math.floor(Math.random() * 360);
            star.style.backgroundColor = `hsl(${hue}, 100%, 70%)`;
            star.style.boxShadow = `0 0 20px hsl(${hue}, 100%, 70%)`;
            
            // 초기 위치
            const size = Math.random() * 30 + 10;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${x - size/2}px`;
            star.style.top = `${y - size/2}px`;

            document.body.appendChild(star);
         
            let rotate = 0;
            let opacity = 1;
            let scale = 1;
            // 약간의 랜덤 이동 방향
            const vx = (Math.random() - 0.5) * 4;
            const vy = (Math.random() - 0.5) * 4;
            let posX = x - size/2;
            let posY = y - size/2;

            function animate() {
                rotate += 10;
                opacity -= 0.02;
                scale -= 0.01;
                posX += vx;
                posY += vy;
                
                star.style.transform = `translate(${vx}px, ${vy}px) rotate(${rotate}deg) scale(${scale})`;
                star.style.left = `${posX}px`;
                star.style.top = `${posY}px`;
                star.style.opacity = opacity;

                if (opacity > 0 && scale > 0) {
                    requestAnimationFrame(animate);
                } else {
                    star.remove();
                }
            }
            
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
